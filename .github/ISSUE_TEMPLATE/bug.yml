name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it quickly.

  - type: dropdown
    id: environment
    attributes:
      label: Environment / Branch
      description: Where did you encounter this bug?
      options:
        - develop
        - staging
        - main / production
        - Local development
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, error messages, or screenshots
      description: Paste relevant stack traces, console errors, or drag-and-drop screenshots here.
      render: shell

  - type: input
    id: browser-os
    attributes:
      label: Environment details (OS / Browser / Runtime)
      placeholder: "e.g., macOS 15, Chrome 130, Node v22"
